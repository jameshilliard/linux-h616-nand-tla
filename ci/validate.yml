# Install as .github/workflows/validate.yml to enable GitHub Actions.
name: Validate NAND contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Execute submitted C with sanitizers
        run: python3 run_c.py
      - name: Execute DMA, IRQ, NAND-core parser, SRAM and timing checks
        run: python3 run_lowlevel.py
      - name: Model-check positive and negative configurations
        run: python3 run.py --download
      - name: Retain diagnostics and counterexamples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nand-validation-results
          path: |
            results/**/summary.json
            results/**/tlc.log
            results/**/trace*.json
            results/**/build.log
            results/**/check.log
            results/**/gcov.log
            results/**/coverage-build.log
            results/**/coverage-check.log
          retention-days: 14
