name: Validate sunxi NAND ECC read policies

on:
  push:
    paths: &inputs
      - '.github/workflows/sunxi-ecc.yml'
      - 'models/NandEcc.tla'
      - 'models/NandSubpage.tla'
      - 'models/NandMarkerAdmission.tla'
      - 'cases.py'
      - 'run.py'
      - 'run_ecc_read_policy.py'
      - 'check_ecc_read_policy.py'
      - 'mtdchar_cases.py'
      - 'run_c.py'
      - 'reference/sunxi_nand.c'
      - 'source.json'
      - 'tests/**'
  pull_request:
    paths: *inputs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecc:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python3 run_ecc_read_policy.py --download
      - run: python3 run_c.py
