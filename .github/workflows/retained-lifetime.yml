name: Validate retained NAND lifetime

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifetime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Explore retained object and shared-controller lifetimes
        run: |
          python3 -m unittest discover -s tests -p test_tlc_result.py
          python3 run_retained_model.py --download
          python3 run_concat_lifetime.py --download
          python3 run_release_owner.py --download
      - name: Execute the candidate C implementation with sanitizers
        run: python3 run_retained_lifetime.py
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: retained-lifetime-validation
          path: |
            results/**/summary.json
            results/**/tlc.log
            results/**/build.log
            results/**/check.log
            results/**/coverage-build.log
            results/**/coverage-check.log
            results/**/gcov.log
          retention-days: 14
