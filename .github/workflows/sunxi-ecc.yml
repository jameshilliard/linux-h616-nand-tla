name: Validate sunxi NAND ECC read policies

on:
  push:
    paths: &inputs
      - '.github/workflows/sunxi-ecc.yml'
      - 'models/NandEcc.tla'
      - 'models/NandSubpage.tla'
      - 'models/NandMarkerAdmission.tla'
      - 'models/NandPlainMarker.tla'
      - 'models/NandStreamingRecovery.tla'
      - 'models/NandOobPipeline.tla'
      - 'cases.py'
      - 'streaming_recovery_cases.py'
      - 'run.py'
      - 'run_ecc_read_policy.py'
      - 'run_oob_pipeline.py'
      - 'oob_pipeline_cases.py'
      - 'check_ecc_read_policy.py'
      - 'mtdchar_cases.py'
      - 'run_c.py'
      - 'run_core.py'
      - 'run_lifecycle.py'
      - 'run_marker_admission.py'
      - 'run_v11.py'
      - 'source_coverage.py'
      - 'reference/sunxi-v11/**'
      - 'reference/nand_base.c'
      - 'reference/rawnand.h'
      - 'reference/sunxi_nand.c'
      - 'source.json'
      - 'tests/**'
  pull_request:
    paths: *inputs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecc:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python3 run_ecc_read_policy.py --download
      - run: python3 run_c.py
      - run: python3 run_v11.py --cc gcc --lifecycle --mutations
      - run: python3 run_v11.py --cc clang
  firmware-bytes:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python3 run_oob_pipeline.py --v11 --download
      - run: python3 run_oob_pipeline.py --v11 --cc clang --source-only
