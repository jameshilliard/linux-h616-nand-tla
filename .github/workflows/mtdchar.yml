name: Validate MTD character-device chunking

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mtdchar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check model harness and source pins
        run: |
          python3 tests/test_tlc_result.py
          python3 tests/test_mtdchar.py
      - name: Explore page, chunk and failure transitions
        run: |
          mkdir -p results
          set -o pipefail
          python3 run_mtdchar_model.py --download 2>&1 | tee results/mtdchar-model.log
      - name: Check actual C traces and sanitizer/coverage results
        run: python3 run_mtdchar.py --v2
      - name: Check the intermediate patch boundaries
        run: python3 run_mtdchar_series.py
      - name: Reproduce the independent admission-statistics bug
        run: python3 run_mtdchar_admission.py
      - name: Retain evidence and counterexamples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mtdchar-validation
          path: |
            results/*.log
            results/**/summary.json
            results/**/tlc.log
            results/**/trace*.json
            results/**/calls.jsonl
            results/**/build.log
            results/**/check.log
            results/**/coverage-build.log
            results/**/coverage-check.log
            results/**/gcov.log
          retention-days: 14
