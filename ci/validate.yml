# Install as .github/workflows/validate.yml to enable GitHub Actions.
name: Validate NAND contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Execute submitted C with sanitizers
        run: python3 run_c.py
      - name: Execute DMA, IRQ, NAND-core parser, SRAM and timing checks
        run: python3 run_lowlevel.py
      - name: Execute MTD request, read-retry and BBT source checks
        run: python3 run_core.py
      - name: Execute scan, cleanup and ONFI negotiation checks
        run: python3 run_lifecycle.py
      - name: Execute external DMA provider entrypoints
        run: python3 run_providers.py
      - name: Cross-check real BCH and independent page formats
        run: python3 run_codec.py
      - name: Compose core requests and BBT with persistent sunxi page operations
        run: python3 run_composed.py
      - name: Execute command transport, vendor retries and byte-copy boundaries
        run: python3 run_transport.py
      - name: Check public MTD and OOB ioctl request boundaries
        run: python3 run_mtd_boundary.py
      - name: Check large-OOB calls against the hardware transfer-count encoding
        run: python3 run_transport.py --count-boundary
      - name: Decode ONFI and ID pages into sunxi attach choices
        run: python3 run_discovery_boundary.py
      - name: Check actual MTD reference and partition removal boundaries
        run: python3 run_lifetime_boundary.py
      - name: Execute provider IRQ, tasklet and virt-dma completion paths
        run: python3 run_provider_boundary.py
      - name: Detect adapted historical regressions
        run: python3 run_historical.py
      - name: Replay sanitized hardware observations and backup safety checks
        run: python3 run_hardware.py
      - name: Model-check positive and negative configurations
        run: python3 run.py --download
      - name: Retain diagnostics and counterexamples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nand-validation-results
          path: |
            results/**/summary.json
            results/**/tlc.log
            results/**/trace*.json
            results/**/build.log
            results/**/check.log
            results/**/gcov.log
            results/**/coverage-build.log
            results/**/coverage-check.log
            results/**/*-build.log
            results/**/driver-bridge.log
          retention-days: 14

  recovery-traces:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Record source-helper recovery schedules with sanitizers
        run: python3 run_lowlevel.py --recovery-traces
      - name: Check every observed schedule and negative control
        run: |
          for summary in results/lowlevel-*/summary.json; do
            python3 run_recovery_refinement.py --download "${summary%/summary.json}"
          done
      - name: Retain recovery diagnostics and observed traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nand-recovery-validation-results
          path: |
            results/**/summary.json
            results/**/recovery-traces.jsonl
            results/**/tlc.log
            results/**/trace*.json
            results/**/build.log
            results/**/check.log
          retention-days: 14

  oob-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check source-generated randomized OOB and ECC observations
        run: python3 run_oob_pipeline.py --download
      - name: Retain OOB inputs, observations and model diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nand-oob-pipeline-results
          path: |
            results/**/summary.json
            results/**/source-summary.json
            results/**/inputs.json
            results/**/vectors.bin
            results/**/oob-traces.jsonl
            results/**/tlc.log
            results/**/trace*.json
            results/**/build.log
            results/**/check.log
          retention-days: 14

  request-and-file-lifetime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Model request, IRQ and device retirement interleavings
        run: python3 run_ordering.py --download
      - name: Check whole-request source traces and independent images
        run: python3 run_request_refinement.py
      - name: Check source MTD open, close and NAND sync lifetimes
        run: python3 run_fd_lifetime.py
      - name: Explore two-user chip and controller locking
        run: python3 run_fd_locking.py
      - name: Retain request and lifetime observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nand-request-lifetime-results
          path: |
            results/**/summary.json
            results/**/request-traces.jsonl
            results/**/request-media.bin
            results/**/request-vectors.bin
            results/**/fd-traces.jsonl
            results/**/tlc.log
            results/**/trace*.json
            results/**/build.log
            results/**/check.log
          retention-days: 14
